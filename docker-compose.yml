services:
  redis:
    image: redis:alpine
    container_name: bithere-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - bithere-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: bithere-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    networks:
      - bithere-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: bithere-minio
    profiles: ["with-minio"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - bithere-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bithere-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      METABASE_URL: http://metabase:3000
      METABASE_PUBLIC_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      DUCKDB_DIR: /app/duckdb
    volumes:
      - ./backend:/app
      - ./reports:/app/reports
      - ./uploads:/app/uploads
      - ./duckdb:/app/duckdb
    networks:
      - bithere-network
    depends_on:
      redis:
        condition: service_healthy
      metabase:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bithere-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - bithere-network
    depends_on:
      - backend

volumes:
  redis_data:
  metabase_data:
  minio_data:

networks:
  bithere-network:
    driver: bridge